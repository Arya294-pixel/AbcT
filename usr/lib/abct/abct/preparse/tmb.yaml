filetype: timber
detect:
  extension: tmb

scope: source.timber

keywords:
    - if
    - elif
    - else
    - for
    - while
    - def
    - return
    - namespace
    - from
    - as
    - pass
    - break
    - continue
    - True
    - False
    - true
    - false
    - None

types:
    - int
    - float
    - i8
    - i16
    - i32
    - i64
    - u8
    - u16
    - u32
    - u64
    - f32
    - f64
    - bool
    - string
    - str
    - void

operators:
    - '+'
    - '-'
    - '*'
    - '/'
    - '%'
    - '=='
    - '!='
    - '<'
    - '>'
    - '<='
    - '>='
    - '='
    - '+='
    - '-='
    - '*='
    - '/='
    - '&&'
    - '||'
    - '!'
    - '.'
    - '::'
    - '{'
    - '}'
    - '('
    - ')'
    - '['
    - ']'
    - ','
    - ';'

strings:
  single: "'"
  double: "\""
  escape: "\\"

comments:
  line: "#"

regex:
  number:
    match: '\b\d+(\.\d+)?\b'
    color: number
  function_call:
    match: '\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\('
    color: func
